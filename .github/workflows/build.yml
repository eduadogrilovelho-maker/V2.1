name: Compilar Soft Aim Core v2.1

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q SoftAimCore-v2.1.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

    

      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Testar e compilar APK
        working-directory: extracted/SoftAimCore-v2.1
        run: gradle -Pandroid.useAndroidX=true --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SoftAimCore-v2.1-debug
          path: extracted/SoftAimCore-v2.1/app/build/outputs/apk/debug/app-debug.apk
